services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ecommerce_ops}
      POSTGRES_USER: ${POSTGRES_USER:-ecommerce_ops}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ecommerce_ops_dev}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./db/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ecommerce_ops} -d ${POSTGRES_DB:-ecommerce_ops}"]
      interval: 5s
      timeout: 5s
      retries: 20

  mock-api:
    build:
      context: ./mock-api
    restart: unless-stopped
    environment:
      PORT: 3000
    ports:
      - "3000:3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/health').then(r=>{if(!r.ok)process.exit(1)})"]
      interval: 5s
      timeout: 3s
      retries: 20

  n8n:
    image: docker.n8n.io/n8nio/n8n:2.37.7
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      mock-api:
        condition: service_healthy
    environment:
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: postgres
      DB_POSTGRESDB_PORT: 5432
      DB_POSTGRESDB_DATABASE: ${POSTGRES_DB:-ecommerce_ops}
      DB_POSTGRESDB_USER: ${POSTGRES_USER:-ecommerce_ops}
      DB_POSTGRESDB_PASSWORD: ${POSTGRES_PASSWORD:-ecommerce_ops_dev}
      DB_POSTGRESDB_SCHEMA: n8n
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY:-local-demo-only-change-me}
      N8N_PORT: 5678
      N8N_HOST: ${N8N_HOST:-localhost}
      N8N_PROTOCOL: ${N8N_PROTOCOL:-http}
      WEBHOOK_URL: ${WEBHOOK_URL:-http://localhost:5678/}
      GENERIC_TIMEZONE: ${GENERIC_TIMEZONE:-Asia/Seoul}
      TZ: ${TZ:-Asia/Seoul}
      MOCK_API_BASE_URL: ${MOCK_API_BASE_URL:-http://mock-api:3000}
      ALERT_WEBHOOK_URL: ${ALERT_WEBHOOK_URL:-http://mock-api:3000/api/notify}
    ports:
      - "5678:5678"
    volumes:
      - n8n_data:/home/node/.n8n
      - ./workflows:/workflows:ro
      - ./fixtures:/fixtures:ro

volumes:
  postgres_data:
  n8n_data:
