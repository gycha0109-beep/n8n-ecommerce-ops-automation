name: p13-daily-trigger-patch

on:
  push:
    paths:
      - '.github/workflows/p13-daily-trigger-patch.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Add CLI-safe daily summary trigger
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          generator = Path('scripts/generate_workflows.py')
          text = generator.read_text(encoding='utf-8')
          old_nodes = """sumnodes=[
           node('Daily 09:00','n8n-nodes-base.scheduleTrigger',1.2,-560,0,{'rule':{'interval':[{'field':'cronExpression','expression':'0 9 * * *'}]}}),
           node('Query Daily Summary','n8n-nodes-base.postgres',2.5,-320,0,"""
          new_nodes = """sumnodes=[
           node('Daily 09:00','n8n-nodes-base.scheduleTrigger',1.2,-560,-100,{'rule':{'interval':[{'field':'cronExpression','expression':'0 9 * * *'}]}}),
           node('When Executed by Another Workflow','n8n-nodes-base.executeWorkflowTrigger',1.1,-560,100,{'inputSource':'passthrough'}),
           node('Query Daily Summary','n8n-nodes-base.postgres',2.5,-320,0,"""
          if old_nodes not in text:
              raise SystemExit('generator daily summary node anchor not found')
          text = text.replace(old_nodes, new_nodes, 1)

          old_connections = """sumcon={'Daily 09:00':{'main':[[{'node':'Query Daily Summary','type':'main','index':0}]]},'Query Daily Summary':{'main':[[{'node':'Build Summary Message','type':'main','index':0}]]},'Build Summary Message':{'main':[[{'node':'Send Summary','type':'main','index':0}]]}}"""
          new_connections = """sumcon={'Daily 09:00':{'main':[[{'node':'Query Daily Summary','type':'main','index':0}]]},'When Executed by Another Workflow':{'main':[[{'node':'Query Daily Summary','type':'main','index':0}]]},'Query Daily Summary':{'main':[[{'node':'Build Summary Message','type':'main','index':0}]]},'Build Summary Message':{'main':[[{'node':'Send Summary','type':'main','index':0}]]}}"""
          if old_connections not in text:
              raise SystemExit('generator daily summary connection anchor not found')
          text = text.replace(old_connections, new_connections, 1)
          generator.write_text(text, encoding='utf-8')

          verifier = Path('scripts/verify-workflows.mjs')
          vtext = verifier.read_text(encoding='utf-8')
          old_check = """if (!summary.nodes.some((node) => node.type === 'n8n-nodes-base.scheduleTrigger')) throw new Error('summary: no schedule trigger');
          for (const node of summary.nodes.filter((node) => node.type === 'n8n-nodes-base.httpRequest')) {"""
          new_check = """if (!summary.nodes.some((node) => node.type === 'n8n-nodes-base.scheduleTrigger')) throw new Error('summary: no schedule trigger');
          const executeTrigger = summary.nodes.find((node) => node.type === 'n8n-nodes-base.executeWorkflowTrigger');
          if (!executeTrigger || executeTrigger.typeVersion !== 1.1 || executeTrigger.parameters?.inputSource !== 'passthrough') {
            throw new Error('summary: no CLI-compatible execute workflow trigger');
          }
          for (const node of summary.nodes.filter((node) => node.type === 'n8n-nodes-base.httpRequest')) {"""
          if old_check not in vtext:
              raise SystemExit('verifier summary anchor not found')
          vtext = vtext.replace(old_check, new_check, 1)
          verifier.write_text(vtext, encoding='utf-8')
          PY

          python scripts/generate_workflows.py
          node scripts/verify-workflows.mjs
          git diff --check
          git diff -- workflows/ecommerce-daily-summary.json scripts/generate_workflows.py scripts/verify-workflows.mjs

      - name: Commit patch and remove bootstrap workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/p13-daily-trigger-patch.yml
          git add scripts/generate_workflows.py scripts/verify-workflows.mjs workflows/ecommerce-daily-summary.json
          git commit -m 'test: add CLI trigger to daily summary'
          git push origin HEAD:main
