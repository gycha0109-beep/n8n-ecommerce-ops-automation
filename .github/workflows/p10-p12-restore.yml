name: p10-p12-restore

on:
  push:
    paths:
      - '.github/workflows/p10-p12-restore.yml'

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore and verify P10-P12 snapshot
        shell: bash
        run: |
          set -euo pipefail
          cat .bootstrap/p10p12.b64.* > /tmp/p10p12.b64
          base64 -d /tmp/p10p12.b64 > /tmp/p10p12.tar.gz
          echo "eeb7d1fb66cc5f7f6604ed1bc98a66f0ca819f0ccb9853debe428388e6213fae  /tmp/p10p12.tar.gz" | sha256sum -c -
          tar -xzf /tmp/p10p12.tar.gz -C "$GITHUB_WORKSPACE"
          rm -rf .bootstrap
          chmod +x scripts/import-workflows.sh scripts/run-smoke.sh scripts/send-webhook.sh
          node scripts/verify-workflows.mjs
          ./scripts/run-smoke.sh
          POSTGRES_PASSWORD=ci-placeholder-password N8N_ENCRYPTION_KEY=ci-placeholder-encryption-key docker compose config >/dev/null
          python - <<'PY'
          from pathlib import Path
          import json
          tracked=[p for p in Path('.').rglob('*') if p.is_file() and '.git' not in p.parts and p.name != '.env']
          bad=[str(p) for p in tracked if p.read_bytes().startswith((b'\xef\xbb\xbf', b'\xff\xfe', b'\xfe\xff'))]
          if bad:
              raise SystemExit(f'BOM detected: {bad}')
          for p in Path('workflows').glob('*.json'):
              json.loads(p.read_text(encoding='utf-8'))
          generator=Path('scripts/generate_workflows.py').read_text(encoding='utf-8')
          if '.item.json' in generator or '$env.' in generator:
              raise SystemExit('stale generator reference')
          compose=Path('docker-compose.yml').read_text(encoding='utf-8')
          for stale in ('postgres:16', 'ecommerce_ops_dev', 'local-demo-only-change-me'):
              if stale in compose:
                  raise SystemExit(f'stale compose value: {stale}')
          print('P10-P12 static audit: PASS')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git update-index --chmod=+x scripts/import-workflows.sh scripts/run-smoke.sh scripts/send-webhook.sh
          git commit -m "chore: complete P10-P12 repository hardening"
          git push origin HEAD:main
