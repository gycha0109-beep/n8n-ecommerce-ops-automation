name: bootstrap-current-snapshot

on:
  push:
    paths:
      - '.github/workflows/bootstrap-upload.yml'

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Restore sanitized repository snapshot
        shell: bash
        run: |
          set -euo pipefail
          cat .bootstrap/archive.b64.* > /tmp/repo.b64
          base64 -d /tmp/repo.b64 > /tmp/repo.tar.gz
          echo "c3c93fb392c28aa86cb0915f1d27f39686fcfc9e4c1adb81c13d0cff8b7d439e  /tmp/repo.tar.gz" | sha256sum -c -
          tar -xzf /tmp/repo.tar.gz -C "$GITHUB_WORKSPACE"
          rm -rf .bootstrap
          rm -f .github/workflows/bootstrap-upload.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "chore: import current portfolio snapshot"
            git push origin HEAD:main
          fi
