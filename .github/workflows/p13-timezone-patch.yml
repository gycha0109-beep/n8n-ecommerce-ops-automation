name: p13-timezone-patch

on:
  push:
    paths:
      - '.github/workflows/p13-timezone-patch.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Make daily summary explicitly Asia/Seoul calendar-day based
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('scripts/generate_workflows.py')
          text = path.read_text(encoding='utf-8')

          old_query = "SELECT (SELECT count(*) FROM orders WHERE processed_at >= date_trunc('day', now()))::int AS successful, (SELECT count(*) FROM exceptions WHERE created_at >= date_trunc('day', now()))::int AS exceptions, (SELECT count(*) FROM exceptions WHERE created_at >= date_trunc('day', now()) AND error_code='ORDER_CANCELLED')::int AS cancelled, (SELECT count(*) FROM exceptions WHERE created_at >= date_trunc('day', now()) AND error_code='DUPLICATE_ORDER')::int AS duplicates_ignored, (SELECT count(*) FROM orders WHERE processed_at >= date_trunc('day', now()) AND retry_recovered)::int AS retry_recovered, (SELECT count(*) FROM failed_jobs WHERE created_at >= date_trunc('day', now()) AND status='dead_letter')::int AS permanent_failures;"
          new_query = "WITH bounds AS (SELECT (date_trunc('day', now() AT TIME ZONE 'Asia/Seoul') AT TIME ZONE 'Asia/Seoul') AS start_at, ((date_trunc('day', now() AT TIME ZONE 'Asia/Seoul') + interval '1 day') AT TIME ZONE 'Asia/Seoul') AS end_at) SELECT (SELECT count(*) FROM orders WHERE processed_at >= b.start_at AND processed_at < b.end_at)::int AS successful, (SELECT count(*) FROM exceptions WHERE created_at >= b.start_at AND created_at < b.end_at)::int AS exceptions, (SELECT count(*) FROM exceptions WHERE created_at >= b.start_at AND created_at < b.end_at AND error_code='ORDER_CANCELLED')::int AS cancelled, (SELECT count(*) FROM exceptions WHERE created_at >= b.start_at AND created_at < b.end_at AND error_code='DUPLICATE_ORDER')::int AS duplicates_ignored, (SELECT count(*) FROM orders WHERE processed_at >= b.start_at AND processed_at < b.end_at AND retry_recovered)::int AS retry_recovered, (SELECT count(*) FROM failed_jobs WHERE created_at >= b.start_at AND created_at < b.end_at AND status='dead_letter')::int AS permanent_failures FROM bounds b;"
          if old_query not in text:
              raise SystemExit('daily summary SQL anchor not found')
          text = text.replace(old_query, new_query, 1)

          old_code = "return [{json:{event:'daily_summary',date:new Date().toISOString().slice(0,10),...$json}}];"
          new_code = "const parts=new Intl.DateTimeFormat('en-US',{timeZone:'Asia/Seoul',year:'numeric',month:'2-digit',day:'2-digit'}).formatToParts(new Date()); const p=Object.fromEntries(parts.map(({type,value})=>[type,value])); const date=`${p.year}-${p.month}-${p.day}`; return [{json:{event:'daily_summary',date,...$json}}];"
          if old_code not in text:
              raise SystemExit('daily summary date-code anchor not found')
          text = text.replace(old_code, new_code, 1)
          path.write_text(text, encoding='utf-8')

          verifier = Path('scripts/verify-workflows.mjs')
          vtext = verifier.read_text(encoding='utf-8')
          anchor = "if (!executeTrigger || executeTrigger.typeVersion !== 1.1 || executeTrigger.parameters?.inputSource !== 'passthrough') {\n  throw new Error('summary: no CLI-compatible execute workflow trigger');\n}\n"
          addition = anchor + "const summaryText = JSON.stringify(summary);\nif (!summaryText.includes(\"AT TIME ZONE 'Asia/Seoul'\") || !summaryText.includes(\"timeZone:'Asia/Seoul'\")) {\n  throw new Error('summary: Asia/Seoul calendar-day contract missing');\n}\n"
          if anchor not in vtext:
              raise SystemExit('verifier daily trigger anchor not found')
          vtext = vtext.replace(anchor, addition, 1)
          verifier.write_text(vtext, encoding='utf-8')
          PY

          python scripts/generate_workflows.py
          node scripts/verify-workflows.mjs
          git diff --check

      - name: Commit generated KST contract
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/generate_workflows.py scripts/verify-workflows.mjs workflows/ecommerce-daily-summary.json
          git commit -m 'fix: make daily summary Asia Seoul day based'
          git push origin HEAD:main
