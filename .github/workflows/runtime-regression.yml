name: p13-runtime-regression

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/runtime-regression.yml'
      - 'docker-compose.yml'
      - 'db/**'
      - 'workflows/**'
      - 'mock-api/**'
      - 'scripts/import-workflows.sh'
      - 'scripts/verify-workflows.mjs'

permissions:
  contents: read

jobs:
  live-runtime-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Generate ephemeral runtime secrets
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          {
            echo 'POSTGRES_DB=ecommerce_ops'
            echo 'POSTGRES_USER=ecommerce_ops'
            echo "POSTGRES_PASSWORD=$(openssl rand -hex 24)"
            echo "N8N_ENCRYPTION_KEY=$(openssl rand -hex 32)"
            echo 'N8N_HOST=localhost'
            echo 'N8N_PROTOCOL=http'
            echo 'WEBHOOK_URL=http://localhost:5678/'
            echo 'GENERIC_TIMEZONE=Asia/Seoul'
            echo 'TZ=Asia/Seoul'
          } > .env

      - name: Validate repository contracts
        shell: bash
        run: |
          set -euo pipefail
          node scripts/verify-workflows.mjs
          docker compose config >/dev/null

      - name: Start PostgreSQL 17, mock API, and n8n
        shell: bash
        run: |
          set -euo pipefail
          docker compose up -d --build
          docker compose ps

      - name: Wait for runtime readiness
        shell: bash
        run: |
          set -euo pipefail
          ready=0
          for _ in $(seq 1 90); do
            if curl -fsS http://localhost:3000/health >/dev/null \
              && curl -fsS http://localhost:5678/healthz/readiness >/dev/null; then
              ready=1
              break
            fi
            sleep 2
          done
          if [ "$ready" -ne 1 ]; then
            docker compose ps
            docker compose logs --no-color
            exit 1
          fi
          curl -fsS http://localhost:3000/health
          curl -fsS http://localhost:5678/healthz
          curl -fsS http://localhost:5678/healthz/readiness

      - name: Verify pinned runtime versions and database initialization
        shell: bash
        run: |
          set -euo pipefail
          pg_version="$(docker compose exec -T postgres postgres --version)"
          n8n_version="$(docker compose exec -T n8n n8n --version | tail -n 1 | tr -d '\r')"
          echo "$pg_version"
          echo "n8n $n8n_version"
          [[ "$pg_version" == *'17.11'* ]]
          [[ "$n8n_version" == '2.37.10' ]]

          server_version="$(docker compose exec -T postgres psql -U ecommerce_ops -d ecommerce_ops -Atc 'SHOW server_version;' | tr -d '\r')"
          echo "PostgreSQL server_version=$server_version"
          [[ "$server_version" == 17.11* ]]

          docker compose exec -T postgres psql -U ecommerce_ops -d ecommerce_ops -v ON_ERROR_STOP=1 -Atc \
            "SELECT to_regclass('public.orders') IS NOT NULL AND to_regclass('public.exceptions') IS NOT NULL AND to_regclass('public.failed_jobs') IS NOT NULL;" \
            | grep -qx 't'

          n8n_table_count="$(docker compose exec -T postgres psql -U ecommerce_ops -d ecommerce_ops -Atc \
            "SELECT count(*) FROM information_schema.tables WHERE table_schema='n8n';" | tr -d '\r')"
          echo "n8n schema table count=$n8n_table_count"
          test "$n8n_table_count" -gt 0

      - name: Bootstrap ephemeral n8n owner
        shell: bash
        run: |
          set -euo pipefail
          OWNER_PASSWORD="$(openssl rand -hex 16)"
          export OWNER_PASSWORD
          python - <<'PY'
          import json, os
          from pathlib import Path
          Path('/tmp/p13-owner.json').write_text(json.dumps({
              'email': 'p13-owner@example.invalid',
              'firstName': 'P13',
              'lastName': 'Runner',
              'password': os.environ['OWNER_PASSWORD'],
          }), encoding='utf-8')
          PY
          curl -fsS -X POST http://localhost:5678/rest/owner/setup \
            -H 'content-type: application/json' \
            --data-binary @/tmp/p13-owner.json >/tmp/p13-owner-response.json
          python - <<'PY'
          import json, urllib.request
          with urllib.request.urlopen('http://localhost:5678/rest/settings', timeout=15) as r:
              body=json.load(r)
          assert body['data']['userManagement']['showSetupOnFirstLoad'] is False, body
          print('n8n owner bootstrap: PASS')
          PY
          rm -f /tmp/p13-owner.json /tmp/p13-owner-response.json
          unset OWNER_PASSWORD

      - name: Import ephemeral Postgres credential
        shell: bash
        run: |
          set -euo pipefail
          set -a
          source .env
          set +a
          python - <<'PY'
          import json, os
          from pathlib import Path
          credential=[{
              'id': 'p13-postgres-credential',
              'name': 'P13 Postgres',
              'type': 'postgres',
              'data': {
                  'host': 'postgres',
                  'database': 'ecommerce_ops',
                  'user': 'ecommerce_ops',
                  'password': os.environ['POSTGRES_PASSWORD'],
                  'port': 5432,
                  'ssl': 'disable',
                  'allowUnauthorizedCerts': False,
                  'maxConnections': 10,
              },
          }]
          Path('/tmp/p13-postgres-credential.json').write_text(json.dumps(credential), encoding='utf-8')
          PY
          n8n_cid="$(docker compose ps -q n8n)"
          docker cp /tmp/p13-postgres-credential.json "$n8n_cid:/tmp/p13-postgres-credential.json"
          docker compose exec -T n8n n8n import:credentials --input=/tmp/p13-postgres-credential.json
          rm -f /tmp/p13-postgres-credential.json
          docker compose exec -T n8n rm -f /tmp/p13-postgres-credential.json
          echo 'Postgres credential import: PASS'

      - name: Bind runtime credential and import workflows
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path

          source=Path('workflows')
          target=Path('/tmp/p13-workflows')
          target.mkdir(exist_ok=True)
          error_id='e0f539bd-1abc-405c-a4f8-7e8861ac83bc'
          for path in source.glob('*.json'):
              workflow=json.loads(path.read_text(encoding='utf-8'))
              for node in workflow.get('nodes', []):
                  if node.get('type') == 'n8n-nodes-base.postgres':
                      node['credentials']={
                          'postgres': {
                              'id': 'p13-postgres-credential',
                              'name': 'P13 Postgres',
                          }
                      }
              if path.name == 'ecommerce-order-intake.json':
                  workflow.setdefault('settings', {})['errorWorkflow']=error_id
              (target/path.name).write_text(json.dumps(workflow, ensure_ascii=False, indent=2)+'\n', encoding='utf-8')
          PY

          n8n_cid="$(docker compose ps -q n8n)"
          for file in /tmp/p13-workflows/*.json; do
            base="$(basename "$file")"
            docker cp "$file" "$n8n_cid:/tmp/$base"
            docker compose exec -T n8n n8n import:workflow --input="/tmp/$base"
            docker compose exec -T n8n rm -f "/tmp/$base"
          done

          docker compose exec -T n8n n8n list:workflow > /tmp/n8n-workflows.txt
          cat /tmp/n8n-workflows.txt
          grep -F '3e7b03e1-93af-4a51-8a16-819aff10b352|E-commerce Order Intake - Reliability Demo' /tmp/n8n-workflows.txt
          grep -F 'e0f539bd-1abc-405c-a4f8-7e8861ac83bc|E-commerce Ops - Global Error Handler' /tmp/n8n-workflows.txt
          grep -F '83131f1e-3aba-4e04-a3b6-bc1946c30661|E-commerce Daily Summary' /tmp/n8n-workflows.txt

      - name: Publish workflows and restart n8n
        shell: bash
        run: |
          set -euo pipefail
          docker compose exec -T n8n n8n publish:workflow --id=e0f539bd-1abc-405c-a4f8-7e8861ac83bc
          docker compose exec -T n8n n8n publish:workflow --id=83131f1e-3aba-4e04-a3b6-bc1946c30661
          docker compose exec -T n8n n8n publish:workflow --id=3e7b03e1-93af-4a51-8a16-819aff10b352
          docker compose restart n8n
          ready=0
          for _ in $(seq 1 60); do
            if curl -fsS http://localhost:5678/healthz/readiness >/dev/null; then
              ready=1
              break
            fi
            sleep 2
          done
          test "$ready" -eq 1
          echo 'Workflow publish/restart: PASS'

      - name: Run live webhook regression
        shell: bash
        run: |
          set -euo pipefail
          webhook='http://localhost:5678/webhook/ecommerce-order-intake'

          post_order() {
            local label="$1"
            local expected_code="$2"
            local expected_status="$3"
            local payload="$4"
            local body="/tmp/${label}.json"
            local code
            code="$(curl -sS -o "$body" -w '%{http_code}' -X POST "$webhook" -H 'content-type: application/json' --data-binary "$payload")"
            echo "$label -> HTTP $code $(cat "$body")"
            test "$code" = "$expected_code"
            python - "$body" "$expected_status" <<'PY'
          import json, sys
          body=json.load(open(sys.argv[1], encoding='utf-8'))
          assert body.get('status') == sys.argv[2], body
          PY
          }

          normal='{"source":"shopify","payload":{"id":"P13-NORMAL","email":"p13-normal@example.com","financial_status":"paid","created_at":"2026-09-07T00:00:00+09:00","currency":"KRW","line_items":[{"sku":"SKU-RED-001","quantity":2,"price":10100}],"integration_mode":"normal","notification_mode":"normal"}}'
          retry='{"source":"shopify","payload":{"id":"P13-RETRY","email":"p13-retry@example.com","financial_status":"paid","created_at":"2026-09-07T00:01:00+09:00","currency":"KRW","line_items":[{"sku":"SKU-BLU-002","quantity":1,"price":15000}],"integration_mode":"fail_twice_then_success","notification_mode":"normal"}}'
          unknown='{"source":"shopify","payload":{"id":"P13-UNKNOWN","email":"p13-unknown@example.com","financial_status":"paid","created_at":"2026-09-07T00:02:00+09:00","currency":"KRW","line_items":[{"sku":"SKU-NOT-FOUND","quantity":1,"price":11000}],"integration_mode":"normal","notification_mode":"normal"}}'
          lowstock='{"source":"shopify","payload":{"id":"P13-LOW-STOCK","email":"p13-stock@example.com","financial_status":"paid","created_at":"2026-09-07T00:03:00+09:00","currency":"KRW","line_items":[{"sku":"SKU-LTD-006","quantity":5,"price":11000}],"integration_mode":"normal","notification_mode":"normal"}}'
          always500='{"source":"shopify","payload":{"id":"P13-ALWAYS-500","email":"p13-500@example.com","financial_status":"paid","created_at":"2026-09-07T00:04:00+09:00","currency":"KRW","line_items":[{"sku":"SKU-GRN-003","quantity":1,"price":15000}],"integration_mode":"always_500","notification_mode":"normal"}}'
          permanent400='{"source":"shopify","payload":{"id":"P13-PERM-400","email":"p13-400@example.com","financial_status":"paid","created_at":"2026-09-07T00:05:00+09:00","currency":"KRW","line_items":[{"sku":"SKU-BLK-004","quantity":1,"price":15000}],"integration_mode":"permanent_400","notification_mode":"normal"}}'
          cancelled='{"source":"shopify","payload":{"id":"P13-CANCELLED","email":"p13-cancel@example.com","financial_status":"cancelled","created_at":"2026-09-07T00:06:00+09:00","currency":"KRW","line_items":[{"sku":"SKU-WHT-005","quantity":1,"price":12000}],"integration_mode":"normal","notification_mode":"normal"}}'

          post_order normal 200 processed "$normal"
          post_order duplicate 202 exception "$normal"
          post_order unknown 202 exception "$unknown"
          post_order lowstock 202 exception "$lowstock"
          post_order retry 200 processed "$retry"
          post_order always500 202 dead_letter "$always500"
          post_order permanent400 202 dead_letter "$permanent400"
          post_order cancelled 202 exception "$cancelled"

          psqlq() {
            docker compose exec -T postgres psql -U ecommerce_ops -d ecommerce_ops -Atc "$1" | tr -d '\r'
          }

          test "$(psqlq "SELECT count(*) FROM orders WHERE order_key='shopify:P13-NORMAL';")" = '1'
          test "$(psqlq "SELECT count(*) FROM exceptions WHERE order_key='shopify:P13-NORMAL' AND error_code='DUPLICATE_ORDER';")" = '1'
          test "$(psqlq "SELECT count(*) FROM exceptions WHERE order_key='shopify:P13-UNKNOWN' AND error_code='UNKNOWN_SKU';")" = '1'
          test "$(psqlq "SELECT count(*) FROM exceptions WHERE order_key='shopify:P13-LOW-STOCK' AND error_code='INSUFFICIENT_STOCK';")" = '1'
          test "$(psqlq "SELECT count(*) FROM orders WHERE order_key='shopify:P13-RETRY' AND retry_recovered=true;")" = '1'
          test "$(psqlq "SELECT count(*) FROM failed_jobs WHERE order_key='shopify:P13-ALWAYS-500' AND error_code='API_TEMPORARY_FAILURE' AND attempts=3 AND status='dead_letter';")" = '1'
          test "$(psqlq "SELECT count(*) FROM failed_jobs WHERE order_key='shopify:P13-PERM-400' AND error_code='API_PERMANENT_FAILURE' AND attempts=1 AND status='dead_letter';")" = '1'
          test "$(psqlq "SELECT count(*) FROM exceptions WHERE order_key='shopify:P13-CANCELLED' AND error_code='ORDER_CANCELLED';")" = '1'
          test "$(psqlq "SELECT count(*) FROM orders WHERE order_key='shopify:P13-CANCELLED';")" = '0'
          test "$(psqlq 'SELECT min(available_quantity) >= 0 FROM inventory;')" = 't'

          orders_before="$(psqlq 'SELECT count(*) FROM orders;')"
          inventory_before="$(psqlq "SELECT string_agg(sku||':'||available_quantity||':'||reserved_quantity, ',' ORDER BY sku) FROM inventory;")"
          post_order rerun_normal 202 exception "$normal"
          post_order rerun_retry 202 exception "$retry"
          orders_after="$(psqlq 'SELECT count(*) FROM orders;')"
          inventory_after="$(psqlq "SELECT string_agg(sku||':'||available_quantity||':'||reserved_quantity, ',' ORDER BY sku) FROM inventory;")"
          test "$orders_before" = "$orders_after"
          test "$inventory_before" = "$inventory_after"

          echo 'Live webhook regression: PASS'

      - name: Execute and reconcile live daily summary
        shell: bash
        run: |
          set -euo pipefail
          psqlq() {
            docker compose exec -T postgres psql -U ecommerce_ops -d ecommerce_ops -Atc "$1" | tr -d '\r'
          }
          successful="$(psqlq "SELECT count(*) FROM orders WHERE processed_at >= date_trunc('day', now());")"
          exceptions="$(psqlq "SELECT count(*) FROM exceptions WHERE created_at >= date_trunc('day', now());")"
          cancelled="$(psqlq "SELECT count(*) FROM exceptions WHERE created_at >= date_trunc('day', now()) AND error_code='ORDER_CANCELLED';")"
          duplicates="$(psqlq "SELECT count(*) FROM exceptions WHERE created_at >= date_trunc('day', now()) AND error_code='DUPLICATE_ORDER';")"
          recovered="$(psqlq "SELECT count(*) FROM orders WHERE processed_at >= date_trunc('day', now()) AND retry_recovered;")"
          failures="$(psqlq "SELECT count(*) FROM failed_jobs WHERE created_at >= date_trunc('day', now()) AND status='dead_letter';")"

          docker compose exec -T n8n n8n execute --id=83131f1e-3aba-4e04-a3b6-bc1946c30661 --rawOutput > /tmp/p13-daily-output.txt
          python - /tmp/p13-daily-output.txt "$successful" "$exceptions" "$cancelled" "$duplicates" "$recovered" "$failures" <<'PY'
          import json, sys
          from pathlib import Path
          text=Path(sys.argv[1]).read_text(encoding='utf-8')
          decoder=json.JSONDecoder()
          execution=None
          for index, char in enumerate(text):
              if char != '{':
                  continue
              try:
                  value, end=decoder.raw_decode(text[index:])
              except json.JSONDecodeError:
                  continue
              if isinstance(value, dict) and 'data' in value and 'workflowData' in value:
                  execution=value
                  break
          if execution is None:
              raise SystemExit('Could not parse n8n execute JSON output')

          found=[]
          def walk(value):
              if isinstance(value, dict):
                  if value.get('event') == 'daily_summary':
                      found.append(value)
                  for child in value.values():
                      walk(child)
              elif isinstance(value, list):
                  for child in value:
                      walk(child)
          walk(execution)
          if not found:
              raise SystemExit('daily_summary payload not found in execution output')
          summary=found[-1]
          expected={
              'successful': int(sys.argv[2]),
              'exceptions': int(sys.argv[3]),
              'cancelled': int(sys.argv[4]),
              'duplicates_ignored': int(sys.argv[5]),
              'retry_recovered': int(sys.argv[6]),
              'permanent_failures': int(sys.argv[7]),
          }
          for key, value in expected.items():
              assert int(summary[key]) == value, (key, summary[key], value)
          print('Daily summary reconciliation: PASS', expected)
          PY

      - name: Check error-workflow binding and PostgreSQL compatibility log
        shell: bash
        run: |
          set -euo pipefail
          docker compose exec -T postgres psql -U ecommerce_ops -d ecommerce_ops -Atc \
            "SELECT settings::jsonb->>'errorWorkflow' FROM n8n.workflow_entity WHERE id='3e7b03e1-93af-4a51-8a16-819aff10b352';" \
            | tr -d '\r' | grep -qx 'e0f539bd-1abc-405c-a4f8-7e8861ac83bc'

          docker compose logs --no-color n8n > /tmp/n8n.log
          if grep -Eiq '(unsupported|not supported|incompatible).{0,80}postgres|postgres.{0,80}(unsupported|not supported|incompatible)' /tmp/n8n.log; then
            cat /tmp/n8n.log
            exit 1
          fi
          echo 'Error workflow binding: PASS'
          echo 'No PostgreSQL compatibility error found in n8n startup log.'

      - name: Capture runtime evidence
        if: always()
        shell: bash
        run: |
          docker compose ps > runtime-compose-ps.txt 2>&1 || true
          docker compose logs --no-color > runtime-compose.log 2>&1 || true
          docker compose exec -T postgres psql -U ecommerce_ops -d ecommerce_ops -Atc 'SHOW server_version;' > runtime-postgres-version.txt 2>&1 || true
          docker compose exec -T n8n n8n --version > runtime-n8n-version.txt 2>&1 || true
          docker compose exec -T postgres psql -U ecommerce_ops -d ecommerce_ops -Atc \
            "SELECT (SELECT count(*) FROM orders)::int AS successful,(SELECT count(*) FROM exceptions)::int AS exceptions,(SELECT count(*) FROM exceptions WHERE error_code='ORDER_CANCELLED')::int AS cancelled,(SELECT count(*) FROM exceptions WHERE error_code='DUPLICATE_ORDER')::int AS duplicates_ignored,(SELECT count(*) FROM orders WHERE retry_recovered)::int AS retry_recovered,(SELECT count(*) FROM failed_jobs WHERE status='dead_letter')::int AS permanent_failures;" \
            > runtime-live-summary.txt 2>&1 || true

      - name: Upload runtime evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p13-runtime-evidence
          path: |
            runtime-compose-ps.txt
            runtime-compose.log
            runtime-postgres-version.txt
            runtime-n8n-version.txt
            runtime-live-summary.txt

      - name: Stop runtime
        if: always()
        shell: bash
        run: docker compose down -v --remove-orphans
