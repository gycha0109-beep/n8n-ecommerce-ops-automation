name: p13-runtime-regression

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/runtime-regression.yml'
      - 'README.md'
      - 'docs/**'
      - 'docker-compose.yml'
      - 'db/**'
      - 'workflows/**'
      - 'mock-api/**'
      - 'scripts/p13-runtime-regression.sh'
      - 'scripts/verify-workflows.mjs'

permissions:
  contents: read

jobs:
  live-runtime-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - name: Run live n8n/PostgreSQL regression
        shell: bash
        run: bash scripts/p13-runtime-regression.sh

      - name: Upload runtime evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: p13-runtime-evidence
          path: generated/p13-*
